name: Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["arena/1e59b826-glossy-w"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug-ci.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GlossyW CI,O=Glossy,C=US"

      - name: Build FOSS Debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GLOSSY_APPLICATION_ID: com.jay.glossyw.debug
          GLOSSY_APP_NAME: GlossyW Debug
          GLOSSY_DEBUG_KEYSTORE_PATH: debug-ci.keystore
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glossyw-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
